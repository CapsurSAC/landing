# ---------------------------------------------------------------------------
# Stack local / staging de la plataforma de captación CAPSUR.
#   pnpm infra:up    -> solo infraestructura (postgres, redis, rabbitmq)
#   pnpm stack:up    -> infraestructura + gateway + migraciones + servicios (profile "apps")
#   pnpm stack:migrate -> solo los jobs de migración (*-migrate)
# Producción (EasyPanel/VPS): ver docker-compose.prod.yml (sin puertos de
# infraestructura publicados, secretos sin valores por defecto, PgBouncer,
# Redis con ACL y backups cifrados).
# Chatwoot NO forma parte de este stack: es un sistema externo al que se
# integra por API y webhooks.
#
# Nota: las definiciones de postgres, redis y rabbitmq se mantienen estables a
# propósito (cambiarlas recrea los contenedores y otros equipos los usan). Los
# cambios de topología de RabbitMQ se aplican en caliente:
#   curl -u capsur:capsur -H "content-type: application/json" -X POST \
#     http://localhost:15672/api/definitions --data-binary @infrastructure/rabbitmq/definitions.json
# ---------------------------------------------------------------------------
name: capsur-lead-platform

x-service-defaults: &service-defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: '10m'
      max-file: '3'

# Endurecimiento común de contenedores de aplicación (C15).
x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ['no-new-privileges:true']
  tmpfs:
    - /tmp:size=64m,mode=1777

x-nest-limits: &nest-limits
  deploy:
    resources:
      limits:
        cpus: '0.50'
        memory: 384M

x-migrate-defaults: &migrate-defaults
  <<: *hardening
  profiles: ['apps']
  restart: 'no'
  deploy:
    resources:
      limits:
        cpus: '0.50'
        memory: 256M
  depends_on:
    postgres: { condition: service_healthy }

services:
  postgres:
    <<: *service-defaults
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERPASSWORD:-postgres}
      POSTGRES_DB: postgres
      PROMOTIONS_DB_PASSWORD: ${PROMOTIONS_DB_PASSWORD:-promotions}
      LEADS_DB_PASSWORD: ${LEADS_DB_PASSWORD:-leads}
      CRM_BRIDGE_DB_PASSWORD: ${CRM_BRIDGE_DB_PASSWORD:-crm_bridge}
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_SUPERUSER:-postgres}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    <<: *service-defaults
    image: redis:7-alpine
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--maxmemory',
        '128mb',
        '--maxmemory-policy',
        'allkeys-lru',
      ]
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    <<: *service-defaults
    image: rabbitmq:4-management-alpine
    ports:
      - '5672:5672'
      - '15672:15672'
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ../rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ../rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'check_running']
      interval: 10s
      timeout: 10s
      retries: 10

  gateway:
    <<: [*service-defaults, *hardening]
    image: traefik:v3.3
    command:
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --providers.file.watch=true
      - --entrypoints.web.address=:8080
      # Tiempos de espera del borde (C13)
      - --entrypoints.web.transport.respondingTimeouts.readTimeout=30s
      - --entrypoints.web.transport.respondingTimeouts.writeTimeout=60s
      - --entrypoints.web.transport.respondingTimeouts.idleTimeout=90s
      - --api.dashboard=false
      - --ping=true
      - --log.level=INFO
      - --accesslog=true
      - --global.checkNewVersion=false
      - --global.sendAnonymousUsage=false
    environment:
      # Host del panel interno y allowlist opcional (CIDR separados por comas; vacío = sin filtro)
      ADMIN_HOST: ${ADMIN_HOST:-admin.localhost}
      ADMIN_IP_ALLOWLIST: ${ADMIN_IP_ALLOWLIST:-}
    ports:
      - '8080:8080'
    volumes:
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    healthcheck:
      test: ['CMD', 'traefik', 'healthcheck', '--ping']
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 128M

  # ------------------- jobs de migración (B6): corren y terminan -------------------
  promotions-migrate:
    <<: *migrate-defaults
    build:
      context: ../..
      dockerfile: apps/promotions-service/Dockerfile
      target: migrate
    image: capsur/promotions-migrate:local
    environment:
      DATABASE_URL: postgresql://promotions:${PROMOTIONS_DB_PASSWORD:-promotions}@postgres:5432/promotions?schema=public

  leads-migrate:
    <<: *migrate-defaults
    build:
      context: ../..
      dockerfile: apps/leads-service/Dockerfile
      target: migrate
    image: capsur/leads-migrate:local
    environment:
      DATABASE_URL: postgresql://leads:${LEADS_DB_PASSWORD:-leads}@postgres:5432/leads?schema=public

  crm-bridge-migrate:
    <<: *migrate-defaults
    build:
      context: ../..
      dockerfile: apps/crm-bridge-service/Dockerfile
      target: migrate
    image: capsur/crm-bridge-migrate:local
    environment:
      DATABASE_URL: postgresql://crm_bridge:${CRM_BRIDGE_DB_PASSWORD:-crm_bridge}@postgres:5432/crm_bridge?schema=public

  # ----------------------------- aplicaciones ------------------------------
  promotions-service:
    <<: [*service-defaults, *hardening, *nest-limits]
    profiles: ['apps']
    build:
      context: ../..
      dockerfile: apps/promotions-service/Dockerfile
      target: runtime
    image: capsur/promotions-service:local
    environment:
      NODE_ENV: production
      PORT: 3001
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://promotions:${PROMOTIONS_DB_PASSWORD:-promotions}@postgres:5432/promotions?schema=public&connection_limit=5
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:8080}
      INTERNAL_API_TOKENS: ${PROMOTIONS_INTERNAL_API_TOKENS:-{"admin-web":"dev-admin-to-promotions","leads-service":"dev-leads-to-promotions"}}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      SENTRY_DSN: ${PROMOTIONS_SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-local}
      CATALOG_CACHE_TTL_SECONDS: ${CATALOG_CACHE_TTL_SECONDS:-60}
      WEB_REVALIDATE_URL: http://web-sis:3000/api/revalidate
      WEB_REVALIDATE_SECRET: ${REVALIDATE_SECRET:-dev-revalidate-secret}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      promotions-migrate: { condition: service_completed_successfully }

  leads-service:
    <<: [*service-defaults, *hardening, *nest-limits]
    profiles: ['apps']
    build:
      context: ../..
      dockerfile: apps/leads-service/Dockerfile
      target: runtime
    image: capsur/leads-service:local
    environment:
      NODE_ENV: production
      PORT: 3002
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://leads:${LEADS_DB_PASSWORD:-leads}@postgres:5432/leads?schema=public&connection_limit=10
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://leads_svc:${LEADS_RABBITMQ_PASSWORD:-leads_svc_local}@rabbitmq:5672
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:8080}
      INTERNAL_API_TOKENS: ${LEADS_INTERNAL_API_TOKENS:-{"admin-web":"dev-admin-to-leads"}}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      SENTRY_DSN: ${LEADS_SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-local}
      PROMOTIONS_SERVICE_URL: http://promotions-service:3001
      PROMOTIONS_SERVICE_TOKEN: ${LEADS_PROMOTIONS_SERVICE_TOKEN:-dev-leads-to-promotions}
      WHATSAPP_NUMBER: ${NEXT_PUBLIC_WHATSAPP_NUMBER:-51987867402}
      BRAND_DISPLAY_NAME: 'Sistemas del Sur'
      REFERENCE_PREFIX: SIS
      IP_HASH_PEPPER: ${IP_HASH_PEPPER:-cambia-esta-pimienta-en-produccion}
      PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY:-ZGV2LW9ubHktcGlpLWtleS0zMi1ieXRlcy1sb25nISE=}
      PII_HASH_KEY: ${PII_HASH_KEY:-ZGV2LW9ubHktaGFzaC1rZXktMzItYnl0ZXMtbG9uZyEhIQ==}
      LEAD_TOKEN_SECRET: ${LEAD_TOKEN_SECRET:-dev-only-lead-token-secret-change-me}
      LEAD_RETENTION_DAYS: ${LEAD_RETENTION_DAYS:-730}
      PERU_HOLIDAYS: ${PERU_HOLIDAYS:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-Sistemas del Sur <no-reply@example.com>}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      leads-migrate: { condition: service_completed_successfully }
      promotions-service: { condition: service_healthy }

  crm-bridge-service:
    <<: [*service-defaults, *hardening, *nest-limits]
    profiles: ['apps']
    build:
      context: ../..
      dockerfile: apps/crm-bridge-service/Dockerfile
      target: runtime
    image: capsur/crm-bridge-service:local
    environment:
      NODE_ENV: production
      PORT: 3003
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://crm_bridge:${CRM_BRIDGE_DB_PASSWORD:-crm_bridge}@postgres:5432/crm_bridge?schema=public&connection_limit=5
      RABBITMQ_URL: amqp://crm_bridge_svc:${CRM_BRIDGE_RABBITMQ_PASSWORD:-crm_bridge_svc_local}@rabbitmq:5672
      INTERNAL_API_TOKENS: ${CRM_BRIDGE_INTERNAL_API_TOKENS:-{"admin-web":"dev-admin-to-crm","ops":"dev-ops-to-crm"}}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      SENTRY_DSN: ${CRM_BRIDGE_SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-local}
      PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY:-ZGV2LW9ubHktcGlpLWtleS0zMi1ieXRlcy1sb25nISE=}
      PII_HASH_KEY: ${PII_HASH_KEY:-ZGV2LW9ubHktaGFzaC1rZXktMzItYnl0ZXMtbG9uZyEhIQ==}
      CHATWOOT_BASE_URL: ${CHATWOOT_BASE_URL:-https://chatwoot.example.com}
      CHATWOOT_BASE_URL_ALLOWLIST: ${CHATWOOT_BASE_URL_ALLOWLIST:-chatwoot.example.com}
      CHATWOOT_ACCOUNT_ID: ${CHATWOOT_ACCOUNT_ID:-1}
      CHATWOOT_INBOX_ID: ${CHATWOOT_INBOX_ID:-1}
      CHATWOOT_INBOX_ID_BY_CAMPUS: ${CHATWOOT_INBOX_ID_BY_CAMPUS:-{"tacna":1}}
      CHATWOOT_API_ACCESS_TOKEN: ${CHATWOOT_API_ACCESS_TOKEN:-change-me}
      CHATWOOT_WEBHOOK_SECRET: ${CHATWOOT_WEBHOOK_SECRET:-change-me}
      CHATWOOT_WEBHOOK_SECRET_PREVIOUS: ${CHATWOOT_WEBHOOK_SECRET_PREVIOUS:-}
      WEBHOOK_IP_ALLOWLIST: ${WEBHOOK_IP_ALLOWLIST:-}
      ASSIGNMENT_STRATEGY: ${ASSIGNMENT_STRATEGY:-round_robin}
      CHATWOOT_AUTO_REPLY_ENABLED: ${CHATWOOT_AUTO_REPLY_ENABLED:-false}
      CATALOG_URLS_JSON: ${CATALOG_URLS_JSON:-{}}
      WHATSAPP_FOLLOWUP_ENABLED: ${WHATSAPP_FOLLOWUP_ENABLED:-false}
      WHATSAPP_FOLLOWUP_TEMPLATE_NAME: ${WHATSAPP_FOLLOWUP_TEMPLATE_NAME:-}
      WHATSAPP_FOLLOWUP_TEMPLATE_LANGUAGE: ${WHATSAPP_FOLLOWUP_TEMPLATE_LANGUAGE:-es}
      WHATSAPP_FOLLOWUP_AFTER_HOURS: ${WHATSAPP_FOLLOWUP_AFTER_HOURS:-24}
      META_PIXEL_ID: ${META_PIXEL_ID:-}
      META_CAPI_ACCESS_TOKEN: ${META_CAPI_ACCESS_TOKEN:-}
      META_CAPI_TEST_EVENT_CODE: ${META_CAPI_TEST_EVENT_CODE:-}
      MAX_SYNC_ATTEMPTS: ${MAX_SYNC_ATTEMPTS:-5}
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      crm-bridge-migrate: { condition: service_completed_successfully }

  web-sis:
    <<: [*service-defaults, *hardening]
    profiles: ['apps']
    build:
      context: ../..
      dockerfile: apps/web-sis/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-}
        NEXT_PUBLIC_WHATSAPP_NUMBER: ${NEXT_PUBLIC_WHATSAPP_NUMBER:-51987867402}
        NEXT_PUBLIC_PRIVACY_POLICY_VERSION: ${NEXT_PUBLIC_PRIVACY_POLICY_VERSION:-2026-11}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:8080}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        NEXT_PUBLIC_EXPERIMENTS_ENABLED: ${NEXT_PUBLIC_EXPERIMENTS_ENABLED:-true}
    image: capsur/web-sis:local
    environment:
      NODE_ENV: production
      PORT: 3000
      PROMOTIONS_SERVICE_URL: http://promotions-service:3001
      LEADS_SERVICE_URL: http://leads-service:3002
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-dev-revalidate-secret}
      SENTRY_DSN: ${WEB_SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-local}
    # Next escribe su caché (imágenes optimizadas, fetch cache) en .next/cache.
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /app/apps/web-sis/.next/cache:size=256m,uid=1000,gid=1000,mode=0755
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    depends_on:
      promotions-service: { condition: service_healthy }
    ports:
      - '3000:3000'

  admin-web:
    <<: [*service-defaults, *hardening]
    profiles: ['apps']
    build:
      context: ../..
      dockerfile: apps/admin-web/Dockerfile
      args:
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
    image: capsur/admin-web:local
    environment:
      NODE_ENV: production
      PORT: 3004
      PROMOTIONS_SERVICE_URL: http://promotions-service:3001
      LEADS_SERVICE_URL: http://leads-service:3002
      CRM_BRIDGE_SERVICE_URL: http://crm-bridge-service:3003
      PROMOTIONS_SERVICE_TOKEN: ${ADMIN_PROMOTIONS_SERVICE_TOKEN:-dev-admin-to-promotions}
      LEADS_SERVICE_TOKEN: ${ADMIN_LEADS_SERVICE_TOKEN:-dev-admin-to-leads}
      CRM_BRIDGE_SERVICE_TOKEN: ${ADMIN_CRM_BRIDGE_SERVICE_TOKEN:-dev-admin-to-crm}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:-dev-only-admin-session-secret-change-me-32b}
      ADMIN_USERS_JSON: ${ADMIN_USERS_JSON:-[]}
      # http en local: la cookie de sesión no puede ser Secure
      ADMIN_COOKIE_SECURE: ${ADMIN_COOKIE_SECURE:-false}
      SENTRY_DSN: ${ADMIN_SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-local}
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /app/apps/admin-web/.next/cache:size=128m,uid=1000,gid=1000,mode=0755
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 384M
    depends_on:
      promotions-service: { condition: service_healthy }
      leads-service: { condition: service_healthy }
    ports:
      - '127.0.0.1:3004:3004'

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
