# ---------------------------------------------------------------------------
# Gateway de borde · PRODUCCIÓN (VPS propio o referencia para EasyPanel).
# La configuración estática (entrypoints, ACME, redirección http->https) está
# en docker-compose.prod.yml. Variables leídas con plantillas Go:
#   PUBLIC_HOST         dominio de la landing (p. ej. sis.edu.pe)
#   ADMIN_HOST          dominio del panel (p. ej. admin.sis.edu.pe)
#   ADMIN_IP_ALLOWLIST  CIDR separados por comas; vacío = sin restricción
#
# Diferencias con dynamic.yml (local): HSTS, TLS mínimo 1.2 con suites
# modernas, routers solo en websecure y con Host() explícito.
# ---------------------------------------------------------------------------
{{- $public := env "PUBLIC_HOST" | default "example.com" }}
{{- $admin := env "ADMIN_HOST" | default "admin.example.com" }}
http:
  routers:
    block-internal:
      rule: "PathPrefix(`/internal`) || Path(`/api/revalidate`) || PathPrefix(`/api/revalidate/`)"
      entryPoints: [websecure]
      priority: 10000
      middlewares: [deny-all]
      service: noop@internal
      tls:
        certResolver: le

    admin:
      rule: "Host(`{{ $admin }}`)"
      entryPoints: [websecure]
      priority: 5000
      middlewares: [admin-ipallowlist, body-limit, compression, admin-security-headers]
      service: admin-web
      tls:
        certResolver: le

    promotions:
      rule: "Host(`{{ $public }}`) && (PathPrefix(`/api/v1/promotions`) || PathPrefix(`/api/v1/specialties`))"
      entryPoints: [websecure]
      middlewares: [body-limit, compression, public-ratelimit, security-headers]
      service: promotions
      tls:
        certResolver: le

    leads:
      rule: "Host(`{{ $public }}`) && (PathPrefix(`/api/v1/leads`) || PathPrefix(`/api/v1/tracking`) || PathPrefix(`/api/v1/complaints`) || PathPrefix(`/api/v1/privacy`))"
      entryPoints: [websecure]
      middlewares: [body-limit, leads-ratelimit, security-headers]
      service: leads
      tls:
        certResolver: le

    chatwoot-webhook:
      rule: "Host(`{{ $public }}`) && Path(`/webhooks/chatwoot`)"
      entryPoints: [websecure]
      middlewares: [body-limit, webhook-ratelimit, security-headers]
      service: crm-bridge
      tls:
        certResolver: le

    web:
      rule: "Host(`{{ $public }}`)"
      entryPoints: [websecure]
      priority: 1
      middlewares: [compression, security-headers]
      service: web
      tls:
        certResolver: le

  middlewares:
    deny-all:
      ipAllowList:
        sourceRange: ["127.0.0.1/32"]

    admin-ipallowlist:
      ipAllowList:
        sourceRange:
{{- range $cidr := splitList "," (env "ADMIN_IP_ALLOWLIST" | default "0.0.0.0/0,::/0") }}
          - "{{ trim $cidr }}"
{{- end }}

    body-limit:
      buffering:
        maxRequestBodyBytes: 1048576
        memRequestBodyBytes: 1048576
        maxResponseBodyBytes: 0

    compression:
      compress:
        encodings: [br, gzip]
        minResponseBodyBytes: 1024

    security-headers:
      headers:
        # HSTS (C13): un año, subdominios incluidos. Activar preload solo tras
        # verificar que TODOS los subdominios sirven https.
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: false
        forceSTSHeader: true
        frameDeny: true
        contentTypeNosniff: true
        browserXssFilter: false
        referrerPolicy: strict-origin-when-cross-origin
        permissionsPolicy: "camera=(), microphone=(), geolocation=(), payment=()"
        customResponseHeaders:
          Server: ""
          X-Powered-By: ""
          X-DNS-Prefetch-Control: "off"
          Cross-Origin-Opener-Policy: "same-origin"
          Cross-Origin-Resource-Policy: "same-origin"

    # Panel: mismas protecciones, sin Referer y sin indexación. La CSP con nonce
    # la pone la propia app (src/proxy.ts).
    admin-security-headers:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: false
        forceSTSHeader: true
        frameDeny: true
        contentTypeNosniff: true
        browserXssFilter: false
        referrerPolicy: no-referrer
        permissionsPolicy: "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
        customResponseHeaders:
          Server: ""
          X-Powered-By: ""
          X-DNS-Prefetch-Control: "off"
          X-Robots-Tag: "noindex, nofollow, noarchive"
          Cross-Origin-Opener-Policy: "same-origin"
          Cross-Origin-Resource-Policy: "same-origin"

    public-ratelimit:
      rateLimit:
        average: 60
        burst: 120
        period: 1m
    leads-ratelimit:
      rateLimit:
        average: 10
        burst: 20
        period: 1m
    webhook-ratelimit:
      rateLimit:
        average: 120
        burst: 240
        period: 1m

  serversTransports:
    default-timeouts:
      forwardingTimeouts:
        dialTimeout: 5s
        responseHeaderTimeout: 30s
        idleConnTimeout: 90s

  services:
    promotions:
      loadBalancer:
        serversTransport: default-timeouts
        servers:
          - url: "http://promotions-service:3001"
    leads:
      loadBalancer:
        serversTransport: default-timeouts
        servers:
          - url: "http://leads-service:3002"
    crm-bridge:
      loadBalancer:
        serversTransport: default-timeouts
        servers:
          - url: "http://crm-bridge-service:3003"
    web:
      loadBalancer:
        serversTransport: default-timeouts
        servers:
          - url: "http://web-sis:3000"
    admin-web:
      loadBalancer:
        serversTransport: default-timeouts
        servers:
          - url: "http://admin-web:3004"

# TLS mínimo 1.2 (C13). Las suites solo aplican a TLS 1.2; TLS 1.3 usa las suyas.
tls:
  options:
    default:
      minVersion: VersionTLS12
      sniStrict: true
      cipherSuites:
        - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305
        - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305
      curvePreferences:
        - X25519
        - CurveP256
