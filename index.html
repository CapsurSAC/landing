<!doctype html>
<html lang="es-PE">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A2A63" />

    <title>CAPSUR Grupo Educativo — ¿Cuál es tu próximo paso profesional?</title>
    <meta
      name="description"
      content="Responde 3 preguntas y recibe orientación personalizada sobre titulación, convalidación, especializaciones, diplomados y capacitación para el trabajo."
    />

    <!-- Open Graph: cómo se ve el enlace al compartirlo -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="¿Cuál es tu próximo paso profesional? — CAPSUR" />
    <meta
      property="og:description"
      content="Responde 3 preguntas y recibe orientación personalizada de nuestros asesores."
    />
    <!-- La URL base sale de VITE_URL_SITIO (.env); WhatsApp y Facebook exigen que sea absoluta -->
    <meta property="og:url" content="%VITE_URL_SITIO%/" />
    <meta property="og:image" content="%VITE_URL_SITIO%/og-capsur.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="es_PE" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Tipografía de marca, alojada en el sitio (src/index.css declara la fuente) -->
    <link rel="preload" href="/fonts/montserrat.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Precarga de la imagen del hero: es la candidata a LCP -->
    <link rel="preload" as="image" href="/hero-estudiantes.webp" fetchpriority="high" />
    <!-- Datos para Google: quién es el grupo (solo datos que constan) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "EducationalOrganization",
        "name": "Grupo CAPSUR",
        "url": "%VITE_URL_SITIO%/",
        "logo": "%VITE_URL_SITIO%/logos/grupo-capsur.webp",
        "subOrganization": [
          { "@type": "EducationalOrganization", "name": "Sistemas del Sur" },
          { "@type": "EducationalOrganization", "name": "Sistemas del Sur Perú" },
          { "@type": "EducationalOrganization", "name": "Avanti" },
          { "@type": "EducationalOrganization", "name": "Cecava" },
          { "@type": "EducationalOrganization", "name": "Matpel" },
          { "@type": "EducationalOrganization", "name": "Magíster Capacítate" },
          { "@type": "EducationalOrganization", "name": "Next Online" },
          { "@type": "EducationalOrganization", "name": "Globalex" }
        ]
      }
    </script>
    <link rel="canonical" href="%VITE_URL_SITIO%/" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
