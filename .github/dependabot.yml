# Propone actualizaciones una vez por semana: dependencias de npm, imágenes
# base del Dockerfile y acciones de la CI. Cada propuesta pasa por la CI.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      desarrollo:
        dependency-type: development
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly, day: monday }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
