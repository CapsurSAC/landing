name: Prueba de carga (k6)

# B18: POST /api/v1/leads a 50 req/s; umbrales p95 < 300 ms y errores < 1 %.
# Manual y solo contra staging (crea leads reales en esa base). Ver
# infrastructure/load/k6-leads.js para preparar el entorno (límites, Turnstile).

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: URL base (vacío = secreto STAGING_URL)
        required: false
        default: ''
      rate:
        description: Peticiones por segundo
        required: false
        default: '50'
      duration:
        description: Duración (formato k6, p. ej. 2m)
        required: false
        default: '2m'

permissions:
  contents: read

jobs:
  k6:
    name: k6 · POST /api/v1/leads
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Ejecutar k6
        env:
          BASE_URL: ${{ inputs.base_url || secrets.STAGING_URL }}
          RATE: ${{ inputs.rate }}
          DURATION: ${{ inputs.duration }}
        run: |
          if [ -z "$BASE_URL" ]; then echo "::error::Define base_url o el secreto STAGING_URL"; exit 1; fi
          docker run --rm -i --user "$(id -u):$(id -g)" -e BASE_URL -e RATE -e DURATION \
            -v "$PWD:/out" grafana/k6:1.4.2 run --summary-export=/out/k6-summary.json - < infrastructure/load/k6-leads.js
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: k6-summary
          path: k6-summary.json
          retention-days: 30
