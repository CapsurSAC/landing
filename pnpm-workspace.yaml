packages:
  - "apps/*"
  - "packages/*"

# Dependencias con scripts de instalación aprobados explícitamente (pnpm >= 10).
allowBuilds:
  "@nestjs/core": true
  "@prisma/client": true
  "@prisma/engines": true
  "@tailwindcss/oxide": true
  "@parcel/watcher": true
  "@swc/core": true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true
  "@scarf/scarf": false
  # Compilaciones nativas opcionales de dockerode/ssh2 (testcontainers): no son necesarias.
  cpu-features: false
  ssh2: false
  protobufjs: false
