name: Seguridad

# C6: detección de secretos con gitleaks (acción oficial) en cada push/PR y semanal.
# C16: escaneo del repositorio con Trivy (dependencias del lockfile, Dockerfiles
#      y compose) + SBOM CycloneDX del repositorio. Las imágenes se escanean en ci.yml.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * 1' # lunes 01:17 hora de Lima
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secretos (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Obligatoria solo si el repositorio pertenece a una organización de GitHub.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'true'
          GITLEAKS_ENABLE_SUMMARY: 'true'

  trivy-repo:
    name: Trivy (repositorio) y SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Vulnerabilidades y configuración (CRITICAL corregibles bloquean)
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: .trivyignore
          skip-dirs: node_modules,.turbo
          format: table
      - name: SBOM CycloneDX del repositorio
        if: always()
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: fs
          scan-ref: .
          format: cyclonedx
          output: sbom-repo.cdx.json
          skip-dirs: node_modules,.turbo
          exit-code: '0'
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: sbom-repo
          path: sbom-repo.cdx.json
          retention-days: 90
