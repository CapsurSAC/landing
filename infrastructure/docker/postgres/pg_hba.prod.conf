# ---------------------------------------------------------------------------
# pg_hba de PRODUCCIÓN (C10). Solo SCRAM y, desde la red, solo con TLS.
# Postgres no publica puertos: solo lo alcanzan PgBouncer, los jobs de
# migración y el servicio de backups dentro de la red interna de Docker.
# TYPE      DATABASE        USER            ADDRESS         METHOD
# ---------------------------------------------------------------------------
# Socket local (entrypoint de la imagen, healthcheck, mantenimiento con exec)
local       all             all                             scram-sha-256
# Conexiones TCP en claro: rechazadas
hostnossl   all             all             0.0.0.0/0       reject
hostnossl   all             all             ::/0            reject
# Superusuario nunca por red
hostssl     all             postgres        0.0.0.0/0       reject
hostssl     all             postgres        ::/0            reject
# Resto: TLS + SCRAM
hostssl     all             all             0.0.0.0/0       scram-sha-256
hostssl     all             all             ::/0            scram-sha-256
