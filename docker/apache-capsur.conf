# ══════════════════════════════════════════════════════════════
#  Apache de la imagen Docker. Equivale a server/.htaccess, salvo
#  la redirección a HTTPS: de eso se encarga Traefik (EasyPanel).
# ══════════════════════════════════════════════════════════════

ServerTokens Prod
ServerSignature Off
TraceEnable Off

# El formulario y la medición mandan unos pocos KB de JSON: lo que pase de
# 1 MB se corta aquí, antes de llegar a PHP.
LimitRequestBody 1048576

# Archivos y carpetas ocultos (.env.local, .git…): no existen para la web.
RedirectMatch 404 "/\.(?!well-known/)"

<Directory /var/www/html>
    Options -Indexes
    AllowOverride None
    Require all granted

    # ── Archivos que nunca deben servirse ─────────────────────
    <FilesMatch "\.(env|ini|log|csv|json|lock|md|yml|yaml|bak|old|orig|swp|sql|sh|example)$">
        Require all denied
    </FilesMatch>

    RewriteEngine On

    # config/ y storage/ viven fuera de la web; si alguien los busca por URL,
    # 404 claro en vez de la landing (así lo verifica la lista de pruebas).
    RewriteRule ^(config|storage|vendor)(/|$) - [R=404,L]

    # ── /programas y /programas/<categoría> son la página de programas
    RewriteRule ^programas(/[a-z-]+)?/?$ /programas.html [L]

    # ── Todo lo que no sea un archivo real ni esté bajo /api va al index.html
    RewriteCond %{REQUEST_URI} !^/(api|admin)/
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteRule . /index.html [L]
</Directory>

# ── En api/ y admin/ solo se sirve lo conocido ───────────────
# Un .php de pruebas subido por error, o una copia "enviar.php.bak", no
# existen para la web. Al añadir un endpoint, súmalo aquí.
<Directory /var/www/html/api>
    <FilesMatch "^(?!(enviar|posible|metricas|reintentar|salud|reclamo)\.php$).+">
        Require all denied
    </FilesMatch>
</Directory>
<Directory /var/www/html/admin>
    DirectoryIndex index.php
    <FilesMatch "^(?!((index|metricas|posibles|datos|reclamos)\.php|panel\.css)$).+">
        Require all denied
    </FilesMatch>
</Directory>

# ── En logos/, fotos-programas/ y fonts/ solo hay archivos estáticos: ahí no se ejecuta nada
<Directory ~ "^/var/www/html/(logos|fotos-programas|fonts)">
    php_admin_flag engine off
    <FilesMatch "\.(php|phtml|php[0-9]|pl|py|cgi|sh|shtml)$">
        Require all denied
    </FilesMatch>
</Directory>

# ── Cabeceras de seguridad ────────────────────────────────────
Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "DENY"
Header always set Referrer-Policy "strict-origin-when-cross-origin"
Header always set Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), interest-cohort=()"
Header always set Cross-Origin-Opener-Policy "same-origin"
Header always set Cross-Origin-Resource-Policy "same-origin"
# La landing solo ejecuta sus propios scripts y los del píxel de Meta y GA4
# (si están activos) y el anti-bots de Cloudflare; solo habla con su servidor y con esos dos; nadie puede
# incrustarla. El panel /admin/ manda su propia política, más estricta, y
# la API no devuelve HTML: a esas rutas no se les pone esta.
<If "%{REQUEST_URI} !~ m#^/(admin|api)/#">
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' https://connect.facebook.net https://www.googletagmanager.com https://challenges.cloudflare.com; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com https://www.facebook.com; img-src 'self' data: https://www.facebook.com https://*.google-analytics.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; font-src 'self'; frame-src https://challenges.cloudflare.com; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'"
</If>
<Else>
    # Sin "always": así ve la que pone el PHP del panel y no la duplica.
    Header setifempty Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'"
</Else>
# Solo cuando la visita llegó por HTTPS a Traefik (no en http://localhost): el
# navegador recuerda un año que este dominio no se abre por HTTP.
Header always set Strict-Transport-Security "max-age=31536000" "expr=%{HTTP:X-Forwarded-Proto} == 'https'"

# ── Caché: assets con hash, un año; el HTML, nunca ────────────
<LocationMatch "^/assets/">
    Header set Cache-Control "public, max-age=31536000, immutable"
</LocationMatch>
<FilesMatch "\.(webp|avif|png|jpe?g|svg|ico)$">
    Header set Cache-Control "public, max-age=15552000"
</FilesMatch>
<FilesMatch "\.html$">
    Header set Cache-Control "no-cache"
</FilesMatch>
