# ---------------------------------------------------------------------------
# gitleaks (C6). Reglas por defecto + excepciones para los valores de
# DESARROLLO documentados públicamente en docs/architecture/v2-integration-spec.md
# (§2 tokens entre servicios, §4 revalidación, §6 RabbitMQ, §7 claves PII) y
# para los marcadores de las plantillas (*.env.example, prod.env.example).
# Cualquier otro secreto con forma real hace fallar el CI.
# Si una excepción nueva es necesaria, añadirla aquí con su justificación y
# NUNCA para un valor usado en producción.
# ---------------------------------------------------------------------------
title = "capsur-lead-platform"

[extend]
useDefault = true

[allowlist]
description = "Claves y contraseñas de desarrollo documentadas en la spec y marcadores de plantillas"
regexTarget = "secret"
regexes = [
  # §7 claves de cifrado/hash de PII y secreto del token de estado (solo desarrollo)
  '''^ZGV2LW9ubHktcGlpLWtleS0zMi1ieXRlcy1sb25nISE=$''',
  '''^ZGV2LW9ubHktaGFzaC1rZXktMzItYnl0ZXMtbG9uZyEhIQ==$''',
  '''^dev-only-[a-z0-9-]+$''',
  # §2 tokens entre servicios de desarrollo y §4 secreto de revalidación
  '''^dev-[a-z]+-to-[a-z]+$''',
  '''^dev-revalidate-secret$''',
  # §6 contraseñas locales de RabbitMQ y usuario administrador local
  '''^(leads_svc_local|crm_bridge_svc_local|capsur)$''',
  # Marcadores de plantillas
  '''^(change-me|changeme|cambia-esta-pimienta-en-produccion)$''',
  '''^ejemplo-[a-z0-9-]+$''',
  # Claves de ejemplo de prod.env.example (base64 de "ejemplo-...-no-usar...")
  '''^ZWplbXBsby[A-Za-z0-9+/=]+$''',
  '''^age1ejemplo[a-z]+$''',
  # Falsos positivos de la regla genérica: credencial local documentada del
  # panel de RabbitMQ, routing keys de eventos, rutas internas y el UUID de
  # ejemplo de docs/api/README.md.
  '''^capsur:capsur$''',
  '''^(lead|crm)\.[a-z.]+\.v[0-9]+$''',
  '''^/?internal/[a-z0-9/_-]+$''',
  '''^7d1f0d3c-5f7e-4f0a-9d8a-0c1c2f6c1a11$''',
]
paths = [
  # Lockfile: hashes de integridad, no secretos.
  '''(^|/)pnpm-lock\.yaml$''',
  # Clientes Prisma generados (no versionados, pero presentes en local).
  '''(^|/)prisma/generated/''',
]
