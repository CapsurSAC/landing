# ---------------------------------------------------------------------------
# Stack de PRODUCCIÓN de referencia (VPS con Docker o guía para EasyPanel).
#
#   docker compose --env-file prod.env -f infrastructure/docker/docker-compose.prod.yml config -q
#   docker compose --env-file prod.env -f infrastructure/docker/docker-compose.prod.yml up -d --build
#
# Diferencias con el compose local (C5, C10, C15, C21, C22, C25, B6, B11):
#   - Postgres, Redis, RabbitMQ y PgBouncer SOLO en la red `internal`
#     (internal: true): sin puertos publicados y sin salida a Internet.
#   - Secretos solo por variables y SIN valores por defecto (`${VAR:?}` falla
#     si faltan; `${VAR?}` exige definirla aunque sea vacía = función apagada).
#     Plantilla: infrastructure/docker/prod.env.example. Gestor recomendado y
#     rotación: docs/security/secrets.md.
#   - PgBouncer en modo transaction delante de Postgres para los servicios
#     (Prisma: `pgbouncer=true&connection_limit=N`). Las migraciones usan
#     conexión DIRECTA a Postgres con el rol <svc>_migrator.
#   - Roles Postgres <svc>_migrator / <svc>_app (prod-roles.sql), TLS
#     obligatorio en conexiones TCP (pg_hba.prod.conf) y SCRAM.
#   - Redis con ACL por servicio (redis/users.acl) y sin persistencia.
#   - RabbitMQ con usuarios por servicio (rabbitmq-setup aplica definitions.json).
#   - Backups cifrados diarios (backup/) con retención de 14 días.
#   - Contenedores read_only, cap_drop ALL, no-new-privileges y límites.
#
# En EasyPanel: cada bloque equivale a una app/servicio del panel; el TLS lo
# termina su Traefik (replicar rutas y middlewares de traefik/dynamic.prod.yml).
# ---------------------------------------------------------------------------
name: capsur-lead-platform-prod

x-defaults: &defaults
  restart: unless-stopped
  security_opt: ['no-new-privileges:true']
  logging:
    driver: json-file
    options:
      max-size: '20m'
      max-file: '5'

x-app: &app
  <<: *defaults
  read_only: true
  cap_drop: [ALL]
  tmpfs:
    - /tmp:size=64m,mode=1777
  networks: [edge, internal]

x-nest-limits: &nest-limits
  deploy:
    resources:
      limits:
        cpus: '1.0'
        memory: 512M
      reservations:
        memory: 192M

x-migrate: &migrate
  security_opt: ['no-new-privileges:true']
  read_only: true
  cap_drop: [ALL]
  tmpfs:
    - /tmp:size=64m,mode=1777
  restart: 'no'
  networks: [internal]
  deploy:
    resources:
      limits:
        cpus: '0.50'
        memory: 256M
  depends_on:
    postgres: { condition: service_healthy }

networks:
  # Tráfico público (gateway) y salida a Internet (Chatwoot, Meta, Turnstile, SMTP, Sentry).
  edge:
  # Datos: sin salida a Internet ni puertos publicados.
  internal:
    internal: true

volumes:
  postgres-data:
  rabbitmq-data:
  backups:
  letsencrypt:

services:
  # ------------------------------- borde ------------------------------------
  gateway:
    <<: *defaults
    image: traefik:v3.3
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    command:
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entryPoint.to=websecure
      - --entrypoints.web.http.redirections.entryPoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.transport.respondingTimeouts.readTimeout=30s
      - --entrypoints.websecure.transport.respondingTimeouts.writeTimeout=60s
      - --entrypoints.websecure.transport.respondingTimeouts.idleTimeout=90s
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL:?}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.tlschallenge=true
      - --api.dashboard=false
      - --ping=true
      - --log.level=WARN
      - --accesslog=true
      - --accesslog.fields.headers.defaultmode=drop
      - --global.checkNewVersion=false
      - --global.sendAnonymousUsage=false
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?}
      ADMIN_HOST: ${ADMIN_HOST:?}
      ADMIN_IP_ALLOWLIST: ${ADMIN_IP_ALLOWLIST?}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./traefik/dynamic.prod.yml:/etc/traefik/dynamic.yml:ro
      - letsencrypt:/letsencrypt
    networks: [edge]
    healthcheck:
      test: ['CMD', 'traefik', 'healthcheck', '--ping']
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M

  # --------------------------------- datos ----------------------------------
  postgres:
    <<: *defaults
    image: postgres:17-alpine
    # El entrypoint arranca como root y baja a `postgres`: necesita estas capacidades.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    shm_size: 256m
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/etc/postgres-tls/server.crt
      - -c
      - ssl_key_file=/etc/postgres-tls/server.key
      - -c
      - ssl_min_protocol_version=TLSv1.2
      - -c
      - password_encryption=scram-sha-256
      - -c
      - hba_file=/prod/pg_hba.conf
      - -c
      - max_connections=150
      - -c
      - log_connections=on
      - -c
      - log_min_duration_statement=500
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERPASSWORD:?}
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: --auth-local=scram-sha-256 --auth-host=scram-sha-256
      PROMOTIONS_MIGRATOR_DB_PASSWORD: ${PROMOTIONS_MIGRATOR_DB_PASSWORD:?}
      PROMOTIONS_APP_DB_PASSWORD: ${PROMOTIONS_APP_DB_PASSWORD:?}
      LEADS_MIGRATOR_DB_PASSWORD: ${LEADS_MIGRATOR_DB_PASSWORD:?}
      LEADS_APP_DB_PASSWORD: ${LEADS_APP_DB_PASSWORD:?}
      CRM_BRIDGE_MIGRATOR_DB_PASSWORD: ${CRM_BRIDGE_MIGRATOR_DB_PASSWORD:?}
      CRM_BRIDGE_APP_DB_PASSWORD: ${CRM_BRIDGE_APP_DB_PASSWORD:?}
      PGBOUNCER_AUTH_PASSWORD: ${PGBOUNCER_AUTH_PASSWORD:?}
      BACKUP_DB_PASSWORD: ${BACKUP_DB_PASSWORD:?}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init-prod-roles.sh:/docker-entrypoint-initdb.d/10-init-prod-roles.sh:ro
      - ./postgres/prod-roles.sql:/prod/prod-roles.sql:ro
      - ./postgres/prod-roles.per-db.sql:/prod/prod-roles.per-db.sql:ro
      - ./postgres/pg_hba.prod.conf:/prod/pg_hba.conf:ro
      # Certificado de servidor (ver docs/operations/backups.md § TLS y
      # infrastructure/deployment/easypanel.md). La clave debe ser 0600 y de uid 70.
      - ${POSTGRES_TLS_DIR:?}:/etc/postgres-tls:ro
    networks: [internal]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -h /var/run/postgresql']
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G

  pgbouncer:
    <<: *defaults
    image: edoburu/pgbouncer:v1.24.1-p1
    read_only: true
    cap_drop: [ALL]
    tmpfs:
      # El entrypoint genera pgbouncer.ini y userlist.txt a partir de las variables.
      - /etc/pgbouncer:size=1m,uid=70,gid=70,mode=0700
      - /tmp:size=16m,mode=1777
    environment:
      DB_HOST: postgres
      DB_PORT: '5432'
      # Solo la credencial de auth_query vive en PgBouncer; el resto se valida
      # contra pg_shadow mediante pgbouncer.get_auth() (prod-roles.per-db.sql).
      DB_USER: pgbouncer_auth
      DB_PASSWORD: ${PGBOUNCER_AUTH_PASSWORD:?}
      AUTH_TYPE: scram-sha-256
      AUTH_USER: pgbouncer_auth
      AUTH_QUERY: SELECT usename, passwd FROM pgbouncer.get_auth($$1)
      POOL_MODE: transaction
      MAX_CLIENT_CONN: '500'
      DEFAULT_POOL_SIZE: '20'
      MAX_PREPARED_STATEMENTS: '200'
      SERVER_TLS_SSLMODE: require
      IGNORE_STARTUP_PARAMETERS: extra_float_digits,options
      LISTEN_PORT: '5432'
    networks: [internal]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ['CMD-SHELL', 'nc -z 127.0.0.1 5432']
      interval: 10s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 128M

  redis:
    <<: *defaults
    image: redis:7-alpine
    user: '999:1000'
    read_only: true
    cap_drop: [ALL]
    tmpfs:
      - /tmp:size=8m,mode=1777
      - /data:size=8m,uid=999,gid=1000
    entrypoint: ['/bin/sh', '/usr/local/etc/redis/start-redis.sh']
    environment:
      PROMOTIONS_REDIS_PASSWORD: ${PROMOTIONS_REDIS_PASSWORD:?}
      LEADS_REDIS_PASSWORD: ${LEADS_REDIS_PASSWORD:?}
      REDIS_HEALTHCHECK_PASSWORD: ${REDIS_HEALTHCHECK_PASSWORD:?}
      REDIS_ADMIN_PASSWORD: ${REDIS_ADMIN_PASSWORD:?}
      REDIS_MAXMEMORY: 192mb
      REDISCLI_AUTH: ${REDIS_HEALTHCHECK_PASSWORD:?}
    volumes:
      - ./redis/users.acl:/usr/local/etc/redis/users.acl:ro
      - ./redis/start-redis.sh:/usr/local/etc/redis/start-redis.sh:ro
    networks: [internal]
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli --user healthcheck --no-auth-warning ping | grep -q PONG']
      interval: 10s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M

  rabbitmq:
    <<: *defaults
    image: rabbitmq:4-management-alpine
    hostname: rabbitmq
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    environment:
      # Administrador (solo panel/operación). Los servicios usan leads_svc y
      # crm_bridge_svc, creados por rabbitmq-setup.
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_ADMIN_USER:?}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_ADMIN_PASSWORD:?}
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:?}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks: [internal]
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'check_running']
      interval: 15s
      timeout: 10s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M

  # Aplica topología y usuarios (con contraseñas de variables) y termina.
  rabbitmq-setup:
    <<: *migrate
    image: node:24-alpine
    working_dir: /setup
    command: ['node', 'apply-definitions.mjs']
    environment:
      RABBITMQ_MGMT_URL: http://rabbitmq:15672
      RABBITMQ_ADMIN_USER: ${RABBITMQ_ADMIN_USER:?}
      RABBITMQ_ADMIN_PASS: ${RABBITMQ_ADMIN_PASSWORD:?}
      RABBITMQ_PASSWORD_LEADS_SVC: ${LEADS_RABBITMQ_PASSWORD:?}
      RABBITMQ_PASSWORD_CRM_BRIDGE_SVC: ${CRM_BRIDGE_RABBITMQ_PASSWORD:?}
    volumes:
      - ../rabbitmq/apply-definitions.mjs:/setup/apply-definitions.mjs:ro
      - ../rabbitmq/definitions.json:/setup/definitions.json:ro
    depends_on:
      rabbitmq: { condition: service_healthy }

  backup:
    <<: *defaults
    build:
      context: ./backup
    image: capsur/pg-backup:prod
    read_only: true
    # crond de busybox necesita cambiar de identidad para ejecutar el job.
    cap_drop: [ALL]
    cap_add: [SETGID, SETUID]
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /run:size=1m,mode=0755
      - /etc/crontabs:size=1m,mode=0755
    environment:
      TZ: America/Lima
      PGHOST: postgres
      PGPORT: '5432'
      PGUSER: backup
      PGPASSWORD: ${BACKUP_DB_PASSWORD:?}
      PGSSLMODE: require
      BACKUP_DATABASES: promotions leads crm_bridge
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:?}
      BACKUP_RETENTION_DAYS: '14'
      BACKUP_SCHEDULE: '15 3 * * *'
    volumes:
      - backups:/backups
    networks: [internal]
    depends_on:
      postgres: { condition: service_healthy }
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M

  # ------------------- jobs de migración (B6): corren y terminan -------------------
  # Conexión DIRECTA a Postgres (no PgBouncer: Prisma Migrate usa advisory locks
  # de sesión) con el rol dueño del esquema.
  promotions-migrate:
    <<: *migrate
    build: { context: ../.., dockerfile: apps/promotions-service/Dockerfile, target: migrate }
    image: capsur/promotions-migrate:${IMAGE_TAG:-prod}
    environment:
      DATABASE_URL: postgresql://promotions_migrator:${PROMOTIONS_MIGRATOR_DB_PASSWORD:?}@postgres:5432/promotions?schema=public&sslmode=require

  leads-migrate:
    <<: *migrate
    build: { context: ../.., dockerfile: apps/leads-service/Dockerfile, target: migrate }
    image: capsur/leads-migrate:${IMAGE_TAG:-prod}
    environment:
      DATABASE_URL: postgresql://leads_migrator:${LEADS_MIGRATOR_DB_PASSWORD:?}@postgres:5432/leads?schema=public&sslmode=require

  crm-bridge-migrate:
    <<: *migrate
    build: { context: ../.., dockerfile: apps/crm-bridge-service/Dockerfile, target: migrate }
    image: capsur/crm-bridge-migrate:${IMAGE_TAG:-prod}
    environment:
      DATABASE_URL: postgresql://crm_bridge_migrator:${CRM_BRIDGE_MIGRATOR_DB_PASSWORD:?}@postgres:5432/crm_bridge?schema=public&sslmode=require

  # ----------------------------- aplicaciones ------------------------------
  # Prisma detrás de PgBouncer (transaction pooling): pgbouncer=true desactiva
  # las sentencias preparadas con nombre; connection_limit = conexiones del
  # pool de Prisma por réplica (réplicas x connection_limit <= DEFAULT_POOL_SIZE x bases).
  promotions-service:
    <<: [*app, *nest-limits]
    build: { context: ../.., dockerfile: apps/promotions-service/Dockerfile, target: runtime }
    image: capsur/promotions-service:${IMAGE_TAG:-prod}
    environment:
      NODE_ENV: production
      PORT: 3001
      LOG_LEVEL: info
      DATABASE_URL: postgresql://promotions_app:${PROMOTIONS_APP_DB_PASSWORD:?}@pgbouncer:5432/promotions?schema=public&pgbouncer=true&connection_limit=5&sslmode=disable
      REDIS_URL: redis://promotions_svc:${PROMOTIONS_REDIS_PASSWORD:?}@redis:6379
      CORS_ORIGINS: https://${PUBLIC_HOST:?}
      INTERNAL_API_TOKENS: ${PROMOTIONS_INTERNAL_API_TOKENS:?}
      SWAGGER_ENABLED: 'false'
      SENTRY_DSN: ${PROMOTIONS_SENTRY_DSN?}
      SENTRY_ENVIRONMENT: production
      CATALOG_CACHE_TTL_SECONDS: '60'
      WEB_REVALIDATE_URL: http://web-sis:3000/api/revalidate
      WEB_REVALIDATE_SECRET: ${REVALIDATE_SECRET:?}
    depends_on:
      pgbouncer: { condition: service_healthy }
      redis: { condition: service_healthy }
      promotions-migrate: { condition: service_completed_successfully }

  leads-service:
    <<: [*app, *nest-limits]
    build: { context: ../.., dockerfile: apps/leads-service/Dockerfile, target: runtime }
    image: capsur/leads-service:${IMAGE_TAG:-prod}
    environment:
      NODE_ENV: production
      PORT: 3002
      LOG_LEVEL: info
      DATABASE_URL: postgresql://leads_app:${LEADS_APP_DB_PASSWORD:?}@pgbouncer:5432/leads?schema=public&pgbouncer=true&connection_limit=10&sslmode=disable
      REDIS_URL: redis://leads_svc:${LEADS_REDIS_PASSWORD:?}@redis:6379
      RABBITMQ_URL: amqp://leads_svc:${LEADS_RABBITMQ_PASSWORD:?}@rabbitmq:5672
      CORS_ORIGINS: https://${PUBLIC_HOST:?}
      INTERNAL_API_TOKENS: ${LEADS_INTERNAL_API_TOKENS:?}
      SWAGGER_ENABLED: 'false'
      SENTRY_DSN: ${LEADS_SENTRY_DSN?}
      SENTRY_ENVIRONMENT: production
      PROMOTIONS_SERVICE_URL: http://promotions-service:3001
      PROMOTIONS_SERVICE_TOKEN: ${LEADS_PROMOTIONS_SERVICE_TOKEN:?}
      WHATSAPP_NUMBER: ${WHATSAPP_NUMBER:?}
      BRAND_DISPLAY_NAME: Sistemas del Sur
      REFERENCE_PREFIX: SIS
      IP_HASH_PEPPER: ${IP_HASH_PEPPER:?}
      PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY:?}
      PII_HASH_KEY: ${PII_HASH_KEY:?}
      LEAD_TOKEN_SECRET: ${LEAD_TOKEN_SECRET:?}
      LEAD_RETENTION_DAYS: '730'
      PERU_HOLIDAYS: ${PERU_HOLIDAYS?}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY?}
      SMTP_URL: ${SMTP_URL?}
      MAIL_FROM: ${MAIL_FROM?}
    depends_on:
      pgbouncer: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq-setup: { condition: service_completed_successfully }
      leads-migrate: { condition: service_completed_successfully }
      promotions-service: { condition: service_healthy }

  crm-bridge-service:
    <<: [*app, *nest-limits]
    build: { context: ../.., dockerfile: apps/crm-bridge-service/Dockerfile, target: runtime }
    image: capsur/crm-bridge-service:${IMAGE_TAG:-prod}
    environment:
      NODE_ENV: production
      PORT: 3003
      LOG_LEVEL: info
      DATABASE_URL: postgresql://crm_bridge_app:${CRM_BRIDGE_APP_DB_PASSWORD:?}@pgbouncer:5432/crm_bridge?schema=public&pgbouncer=true&connection_limit=5&sslmode=disable
      RABBITMQ_URL: amqp://crm_bridge_svc:${CRM_BRIDGE_RABBITMQ_PASSWORD:?}@rabbitmq:5672
      INTERNAL_API_TOKENS: ${CRM_BRIDGE_INTERNAL_API_TOKENS:?}
      SWAGGER_ENABLED: 'false'
      SENTRY_DSN: ${CRM_BRIDGE_SENTRY_DSN?}
      SENTRY_ENVIRONMENT: production
      PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY:?}
      PII_HASH_KEY: ${PII_HASH_KEY:?}
      CHATWOOT_BASE_URL: ${CHATWOOT_BASE_URL:?}
      CHATWOOT_BASE_URL_ALLOWLIST: ${CHATWOOT_BASE_URL_ALLOWLIST:?}
      CHATWOOT_ACCOUNT_ID: ${CHATWOOT_ACCOUNT_ID:?}
      CHATWOOT_INBOX_ID: ${CHATWOOT_INBOX_ID:?}
      CHATWOOT_INBOX_ID_BY_CAMPUS: ${CHATWOOT_INBOX_ID_BY_CAMPUS:?}
      CHATWOOT_API_ACCESS_TOKEN: ${CHATWOOT_API_ACCESS_TOKEN:?}
      CHATWOOT_WEBHOOK_SECRET: ${CHATWOOT_WEBHOOK_SECRET:?}
      CHATWOOT_WEBHOOK_SECRET_PREVIOUS: ${CHATWOOT_WEBHOOK_SECRET_PREVIOUS?}
      WEBHOOK_IP_ALLOWLIST: ${WEBHOOK_IP_ALLOWLIST?}
      ASSIGNMENT_STRATEGY: ${ASSIGNMENT_STRATEGY:-round_robin}
      CHATWOOT_AUTO_REPLY_ENABLED: ${CHATWOOT_AUTO_REPLY_ENABLED:-false}
      CATALOG_URLS_JSON: ${CATALOG_URLS_JSON?}
      WHATSAPP_FOLLOWUP_ENABLED: ${WHATSAPP_FOLLOWUP_ENABLED:-false}
      WHATSAPP_FOLLOWUP_TEMPLATE_NAME: ${WHATSAPP_FOLLOWUP_TEMPLATE_NAME?}
      WHATSAPP_FOLLOWUP_TEMPLATE_LANGUAGE: ${WHATSAPP_FOLLOWUP_TEMPLATE_LANGUAGE:-es}
      WHATSAPP_FOLLOWUP_AFTER_HOURS: ${WHATSAPP_FOLLOWUP_AFTER_HOURS:-24}
      META_PIXEL_ID: ${META_PIXEL_ID?}
      META_CAPI_ACCESS_TOKEN: ${META_CAPI_ACCESS_TOKEN?}
      META_CAPI_TEST_EVENT_CODE: ''
      MAX_SYNC_ATTEMPTS: '5'
    depends_on:
      pgbouncer: { condition: service_healthy }
      rabbitmq-setup: { condition: service_completed_successfully }
      crm-bridge-migrate: { condition: service_completed_successfully }

  web-sis:
    <<: *app
    build:
      context: ../..
      dockerfile: apps/web-sis/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ''
        NEXT_PUBLIC_WHATSAPP_NUMBER: ${WHATSAPP_NUMBER:?}
        NEXT_PUBLIC_PRIVACY_POLICY_VERSION: ${NEXT_PUBLIC_PRIVACY_POLICY_VERSION:?}
        NEXT_PUBLIC_SITE_URL: https://${PUBLIC_HOST:?}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY?}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN?}
        NEXT_PUBLIC_EXPERIMENTS_ENABLED: ${NEXT_PUBLIC_EXPERIMENTS_ENABLED:-true}
    image: capsur/web-sis:${IMAGE_TAG:-prod}
    environment:
      NODE_ENV: production
      PORT: 3000
      PROMOTIONS_SERVICE_URL: http://promotions-service:3001
      LEADS_SERVICE_URL: http://leads-service:3002
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:?}
      SENTRY_DSN: ${WEB_SENTRY_DSN?}
      SENTRY_ENVIRONMENT: production
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /app/apps/web-sis/.next/cache:size=512m,uid=1000,gid=1000,mode=0755
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M
    depends_on:
      promotions-service: { condition: service_healthy }

  admin-web:
    <<: *app
    build:
      context: ../..
      dockerfile: apps/admin-web/Dockerfile
      args:
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN?}
    image: capsur/admin-web:${IMAGE_TAG:-prod}
    environment:
      NODE_ENV: production
      PORT: 3004
      PROMOTIONS_SERVICE_URL: http://promotions-service:3001
      LEADS_SERVICE_URL: http://leads-service:3002
      CRM_BRIDGE_SERVICE_URL: http://crm-bridge-service:3003
      PROMOTIONS_SERVICE_TOKEN: ${ADMIN_PROMOTIONS_SERVICE_TOKEN:?}
      LEADS_SERVICE_TOKEN: ${ADMIN_LEADS_SERVICE_TOKEN:?}
      CRM_BRIDGE_SERVICE_TOKEN: ${ADMIN_CRM_BRIDGE_SERVICE_TOKEN:?}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:?}
      ADMIN_USERS_JSON: ${ADMIN_USERS_JSON:?}
      ADMIN_COOKIE_SECURE: 'true'
      SENTRY_DSN: ${ADMIN_SENTRY_DSN?}
      SENTRY_ENVIRONMENT: production
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /app/apps/admin-web/.next/cache:size=128m,uid=1000,gid=1000,mode=0755
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    depends_on:
      promotions-service: { condition: service_healthy }
      leads-service: { condition: service_healthy }
