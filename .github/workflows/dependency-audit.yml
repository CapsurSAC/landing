name: Auditoría de dependencias

# C17: revisión semanal de vulnerabilidades en dependencias de producción.
# Renovate (renovate.json) propone las actualizaciones; este workflow avisa
# aunque no haya PRs abiertos.

on:
  schedule:
    - cron: '23 11 * * 1' # lunes 06:23 hora de Lima
  workflow_dispatch:
  pull_request:
    paths:
      - pnpm-lock.yaml
      - .github/workflows/dependency-audit.yml

permissions:
  contents: read

env:
  PNPM_VERSION: 12.18.0
  NODE_VERSION: 24
  HUSKY: 0

jobs:
  pnpm-audit:
    name: pnpm audit --prod
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          install: 'false'
      - name: Vulnerabilidades altas o críticas en dependencias de producción
        run: |
          pnpm audit --prod --audit-level high | tee audit.txt
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: pnpm-audit
          path: audit.txt
          retention-days: 30

  osv-scanner:
    name: OSV-Scanner
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.7.0
    with:
      scan-args: |-
        --lockfile=pnpm-lock.yaml
      # Code Scanning requiere GitHub Advanced Security en repositorios privados.
      upload-sarif: ${{ github.event.repository.private == false }}
      fail-on-vuln: true
